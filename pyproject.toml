[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tangicortex"
version = "1.0.0"
description = "Interfaz tangible para explorar un cerebro real (Human Organ Atlas, HiP-CT) con una sonda sobre un cráneo de plástico"
readme = "README.md"
requires-python = ">=3.11,<3.14"  # zarr 3 pide >=3.11; compresso trae binarios hasta 3.13
# Licencia del código: por definir. Datos: CC BY 4.0 (Human Organ Atlas), se descargan aparte.
authors = [
  { name = "Nicolás Baier-Quezada" },
  { name = "Vanessa Uribe-Hernández" },
  { name = "Fernanda López-Moncada" },
  { name = "Benjamín Catipillán-Ulloa" },
]
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "pygame>=2.5",
  "pyserial>=3.5",
  "zarr>=3",
  "fsspec>=2024.2",
  "aiohttp>=3.9",
  "requests>=2.31",
  "compresso>=3.3",
]

[project.optional-dependencies]
binario = ["pyinstaller>=6.5"]

[project.scripts]
tangicortex = "tangicortex:main"

[tool.setuptools]
py-modules = ["tangicortex", "paquetes", "instalador", "vista3d"]
